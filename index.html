<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Быстрый список — семейные списки покупок, работает офлайн" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <title>Быстрый список</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #fff; color: #222;
      font-family: system-ui, -apple-system, sans-serif; }
    header { display: flex; align-items: center; gap: 12px; padding: 10px 14px;
      border-bottom: 1px solid #eee; position: sticky; top: 0; background: #fff; z-index: 5; }
    header h1 { font-size: 18px; margin: 0; flex: 1; }
    #appVerHead { font-size: 12px; color: #888; white-space: nowrap; }
    #menuBtn { font-size: 22px; padding: 6px 12px; font-weight: bold; }
    .netwrap { display: inline-flex; flex-direction: column; align-items: center; line-height: 1; }
    #netStatus { font-size: 24px; }
    #netType { font-size: 9px; color: #888; min-height: 10px; }
    #syncLight.blink { animation: synblink 1s infinite; }
    @keyframes synblink { 50% { opacity: .25; } }
    #syncLight { display: inline-block; position: relative; width: 14px; height: 14px;
      border-radius: 3px; background: #bbb; flex: none; overflow: hidden; cursor: pointer;
      color: #fff; font-weight: bold; font-size: 11px; line-height: 14px; text-align: center; }
    #syncLight.alert::before, #syncLight.alert::after { display: none; }
    #syncLight::before { content: ''; position: absolute; left: 0; right: 0; top: 5px;
      height: 4px; background: rgba(255,255,255,.75); }
    #syncLight::after { content: ''; position: absolute; top: 0; bottom: 0; left: 5px;
      width: 4px; background: rgba(255,255,255,.75); }
    button { font-size: 16px; padding: 8px 12px; cursor: pointer; }
    main { padding: 12px 14px 40px; }
    #crumb { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
    #grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    @media (orientation: portrait) { #screen-add #grid { grid-template-columns: repeat(3, 1fr); } }
    .btn { position: relative; border: 2px solid #ddd; border-radius: 10px; background: #fff;
      min-height: 84px; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 24px 8px 32px; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    .btn.empty .btn-label { font-size: 40px; color: #bbb; }
    .btn:active { background: #e8f0fe; border-color: #4a90e2; }
    .btn.has-active { border-color: #4a90e2; box-shadow: 0 0 0 2px #4a90e2 inset; }
    .btn.bought { border-color: #d32f2f; box-shadow: 0 0 0 2px #d32f2f inset; }
    .btn button:disabled { opacity: .35; }
    .btn-label { font-size: 16px; line-height: 1.2; word-break: break-word; }
    .badge { position: absolute; top: 4px; right: 6px; background: #4a90e2; color: #fff;
      border-radius: 12px; padding: 2px 8px; font-size: 14px; font-weight: bold; }
    .minus { position: absolute; bottom: 4px; left: 4px; font-size: 16px; padding: 4px 14px; }
    .plus { position: absolute; bottom: 4px; right: 4px; font-size: 16px; padding: 4px 14px; }
    .mfirst { position: absolute; top: 4px; left: 4px; font-size: 16px; padding: 4px 14px; }
    .mlast { position: absolute; top: 4px; right: 4px; font-size: 16px; padding: 4px 14px; }
    .btn.sorting { border-style: dashed; border-color: #888; }
    .qty { position: absolute; top: 5px; left: 0; right: 0; text-align: center;
      font-weight: bold; font-size: 15px; color: #333; pointer-events: none; }
    .group { margin-bottom: 14px; border: 1px solid #eee; border-radius: 8px; padding: 8px 10px; }
    .group.done { opacity: .75; }
    .group-title { font-weight: bold; margin-bottom: 6px; }
    .group.done > .group-title { text-decoration: line-through; }
    .row { display: flex; gap: 10px; align-items: center; padding: 8px 0;
      border-top: 1px solid #f0f0f0; user-select: none; -webkit-user-select: none; }
    .row input { width: 22px; height: 22px; }
    .row-name { flex: 1; }
    .row.done .row-name { text-decoration: line-through; color: #888; }
    .row-qty { color: #555; min-width: 44px; text-align: left; font-weight: bold; }
    footer { position: fixed; bottom: 0; left: 0; right: 0; background: #fff;
      border-top: 1px solid #eee; padding: 6px 14px; font-size: 13px; color: #666; }
    #modalBack { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,.4); z-index: 50; align-items: center; justify-content: center; padding: 20px; }
    #modalBack.open { display: flex; }
    #modalBox { background: #fff; border-radius: 10px; padding: 18px; width: 100%; max-width: 380px; }
    #modalText { margin-bottom: 10px; white-space: pre-wrap; word-break: break-word;
      max-height: 50vh; overflow-y: auto; font-size: 14px; }
    #modalInput { width: 100%; font-size: 18px; padding: 10px; margin-bottom: 12px; }
    #modalBox .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap;
      border-top: none; padding: 0; }
    #modalBox .row button { flex: 1 1 auto; white-space: nowrap; }
    #gearMenu { display: none; position: fixed; top: 54px; right: 8px; background: #fff;
      border: 1px solid #ddd; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.2);
      z-index: 40; min-width: 240px; overflow: hidden; }
    #gearMenu.open { display: block; }
    #gearMenu button { display: block; width: 100%; text-align: left; background: none;
      border: none; border-bottom: 1px solid #f0f0f0; padding: 12px 14px; }
    #gearMenu button:last-child { border-bottom: none; }
    .gear-settings { padding: 8px 12px 12px; border-top: 1px solid #eee; }
    .gear-settings input { display: block; width: 100%; box-sizing: border-box;
      font-size: 14px; padding: 8px 10px; margin: 0 0 8px; }
    .gear-settings small { color: #666; }
  </style>
</head>
<body>
  <header>
    <button id="menuBtn" aria-label="Переключить режим">Д</button>
    <h1>Быстрый список</h1>
    <span id="appVerHead" title="Версия приложения"></span>
    <span class="netwrap"><span id="netStatus" title="Сеть">⇅</span><span id="netType"></span></span>
    <span id="syncLight" title="Синхронизация"></span>
    <button id="gearBtn" title="Меню" aria-label="Меню">⚙</button>
  </header>

  <div id="gearMenu">
    <button id="diagBtn">ⓘ Информация для диагностики</button>
    <button id="syncNowBtn">⇅ Синхронизировать</button>
    <button id="installBtn">📲 Установить приложение</button>
    <button id="shareBtn">📤 Поделиться списком</button>
    <button id="sortBtn">↕ Порядок</button>
    <button id="clearList">Очистить список</button>
    <button id="clearCache">Очистить кэш</button>
    <button id="clearAll">Сбросить все названия</button>
    <div class="gear-settings">
      <input id="repoInput" placeholder="owner/repo" autocomplete="off" />
      <span id="tokenWrap"></span>
      <button id="saveSettings">Сохранить</button>
      <small>Без токена всё работает локально и офлайн.
        <a href="./docs/USER_GUIDE.html">Инструкция</a>
        <span id="appVer"></span></small>
    </div>
  </div>

  <main id="screen-add">
    <div id="crumb"></div>
    <div id="grid"></div>
  </main>

  <main id="screen-list" style="display:none">
    <div id="groups"></div>
  </main>

  <footer id="status">Загрузка…</footer>

  <div id="modalBack">
    <div id="modalBox">
      <div id="modalText"></div>
      <input id="modalInput" autocomplete="off" />
      <div class="row">
        <button id="modalOk">OK</button>
        <button id="modalClear" style="display:none">Очистить</button>
        <button id="modalCancel">Отмена</button>
      </div>
    </div>
  </div>

  <script src="./src/logic.js"></script>
  <script src="./store.js"></script>
  <script src="./sync.js"></script>
  <script src="./journal.js"></script>
  <script src="./app.js"></script>
</body>
</html>
