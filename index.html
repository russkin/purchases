<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#4a90e2" />
  <meta name="description" content="Purchases — простое PWA для учёта покупок" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <title>Purchases PWA</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #f5f7fa; color: #222; }
    main { max-width: 560px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h1 { margin-top: 0; }
    form { display: flex; gap: 8px; margin: 16px 0; }
    input { flex: 1; padding: 10px; font-size: 16px; }
    button { padding: 10px 16px; font-size: 16px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
    .status { margin-top: 12px; font-size: 14px; color: #666; }
  </style>
</head>
<body>
  <main>
    <h1>Purchases</h1>
    <p>Простое PWA: работает офлайн, устанавливается на телефон.</p>
    <form id="form">
      <input id="input" placeholder="Что купить?" autocomplete="off" required />
      <button type="submit">Добавить</button>
    </form>
    <ul id="list"></ul>
    <div class="status" id="status">Готово</div>
  </main>
  <script>
    const list = document.getElementById('list');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const status = document.getElementById('status');
    let items = JSON.parse(localStorage.getItem('purchases') || '[]');
    function render() {
      list.innerHTML = '';
      items.forEach((item, i) => {
        const li = document.createElement('li');
        li.innerHTML = '<span></span><button>×</button>';
        li.querySelector('span').textContent = item;
        li.querySelector('button').onclick = () => { items.splice(i, 1); save(); };
        list.appendChild(li);
      });
      status.textContent = 'Всего: ' + items.length + (navigator.onLine ? ' (online)' : ' (offline)');
    }
    function save() {
      localStorage.setItem('purchases', JSON.stringify(items));
      render();
    }
    form.onsubmit = (e) => {
      e.preventDefault();
      items.push(input.value.trim());
      input.value = '';
      save();
    };
    window.addEventListener('online', render);
    window.addEventListener('offline', render);
    render();
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(console.error);
    }
  </script>
</body>
</html>
