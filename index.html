<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Быстрый список — семейные списки покупок, работает офлайн" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <title>Быстрый список</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #fff; color: #222;
      font-family: system-ui, -apple-system, sans-serif; }
    header { display: flex; align-items: center; gap: 12px; padding: 10px 14px;
      border-bottom: 1px solid #eee; position: sticky; top: 0; background: #fff; z-index: 5; }
    header h1 { font-size: 18px; margin: 0; flex: 1; }
    #menuBtn { font-size: 22px; padding: 6px 12px; }
    button { font-size: 16px; padding: 8px 12px; cursor: pointer; }
    #drawer { display: none; padding: 12px 14px; border-bottom: 1px solid #eee; background: #fafafa; }
    #drawer.open { display: block; }
    #drawer .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; align-items: center; }
    #drawer input { font-size: 16px; padding: 8px; min-width: 220px; }
    #drawer .on { font-weight: bold; outline: 2px solid #4a90e2; }
    #drawer small { color: #666; }
    main { padding: 12px 14px 40px; }
    #crumb { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
    #grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    @media (orientation: portrait) { #screen-add #grid { grid-template-columns: repeat(3, 1fr); } }
    .btn { position: relative; border: 2px solid #ddd; border-radius: 10px; background: #fff;
      min-height: 84px; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 8px; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    .btn.empty .btn-label { font-size: 40px; color: #bbb; }
    .btn:active { background: #e8f0fe; border-color: #4a90e2; }
    .btn-label { font-size: 16px; line-height: 1.2; word-break: break-word; }
    .badge { position: absolute; top: 4px; right: 6px; background: #4a90e2; color: #fff;
      border-radius: 12px; padding: 2px 8px; font-size: 14px; font-weight: bold; }
    .minus { position: absolute; bottom: 4px; right: 4px; font-size: 14px; padding: 2px 10px; }
    .group { margin-bottom: 14px; border: 1px solid #eee; border-radius: 8px; padding: 8px 10px; }
    .group.done { opacity: .75; }
    .group-title { font-weight: bold; margin-bottom: 6px; }
    .group.done > .group-title { text-decoration: line-through; }
    .row { display: flex; gap: 10px; align-items: center; padding: 8px 0;
      border-top: 1px solid #f0f0f0; user-select: none; -webkit-user-select: none; }
    .row input { width: 22px; height: 22px; }
    .row-name { flex: 1; }
    .row.done .row-name { text-decoration: line-through; color: #888; }
    .row-qty { color: #555; min-width: 40px; text-align: right; }
    footer { position: fixed; bottom: 0; left: 0; right: 0; background: #fff;
      border-top: 1px solid #eee; padding: 6px 14px; font-size: 13px; color: #666; }
    #modalBack { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,.4); z-index: 50; align-items: center; justify-content: center; padding: 20px; }
    #modalBack.open { display: flex; }
    #modalBox { background: #fff; border-radius: 10px; padding: 18px; width: 100%; max-width: 380px; }
    #modalText { margin-bottom: 10px; }
    #modalInput { width: 100%; font-size: 18px; padding: 10px; margin-bottom: 12px; }
    #modalBox .row { display: flex; gap: 8px; justify-content: flex-end; }
  </style>
</head>
<body>
  <header>
    <button id="menuBtn" aria-label="Меню">☰</button>
    <h1>Быстрый список</h1>
    <span id="netStatus" title="Сеть">●</span>
    <button id="syncBtn" title="Синхронизировать">⇅</button>
  </header>

  <nav id="drawer">
    <div class="row">
      <button id="modeAdd">Добавление</button>
      <button id="modeList">Список</button>
    </div>
    <div class="row">
      <button id="clearList">Очистить список</button>
      <button id="clearAll">Очистить все кнопки</button>
      <button id="clearCache">Очистить кэш</button>
    </div>
    <div class="row">
      <input id="repoInput" placeholder="owner/repo" autocomplete="off" />
      <input id="tokenInput" type="password" placeholder="GitHub token (только на этом устройстве)" autocomplete="off" />
      <button id="saveSettings">Сохранить</button>
    </div>
    <small>Синхронизация необязательна: без токена всё работает локально и офлайн.
      <a href="./docs/USER_GUIDE.html">Инструкция</a></small>
  </nav>

  <main id="screen-add">
    <div id="crumb"></div>
    <div id="grid"></div>
  </main>

  <main id="screen-list" style="display:none">
    <div id="groups"></div>
  </main>

  <footer id="status">Загрузка…</footer>

  <div id="modalBack">
    <div id="modalBox">
      <div id="modalText"></div>
      <input id="modalInput" autocomplete="off" />
      <div class="row">
        <button id="modalOk">OK</button>
        <button id="modalCancel">Отмена</button>
      </div>
    </div>
  </div>

  <script src="./src/logic.js"></script>
  <script src="./store.js"></script>
  <script src="./sync.js"></script>
  <script src="./app.js"></script>
</body>
</html>
